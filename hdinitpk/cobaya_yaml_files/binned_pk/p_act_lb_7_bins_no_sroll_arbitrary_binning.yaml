      dist: norm
      loc: 2.0
      scale: 0.35
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0003
    proposal: 0.00015
    latex: \Omega_\mathrm{b}h^2
    renames:
    - omegabh2
