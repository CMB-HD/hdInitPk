    variant: actplanck_baseline
    apply_hartlap: true
    limber: false
    nz: 100
    kmax: 40
    zmax: null
    scale_cov: null
    varying_cmb_alens: false
    version: null
    act_cmb_rescale: false
    act_calib: false
    type: []
    speed: -1
    stop_at_error: true
    input_params: []
    output_params: []
params:
  b1:
    latex: 10^9 e^{-2\tau}\mathcal{P}_{1}(k)
    prior:
      max: 15.0
