# ----------------------------------------------------------------------
# Every `/path/to/...` is a placeholder that must be edited before running:
#   /path/to/hdInitPk        this repository (the directory holding
#                            `pyproject.toml` and `arbitrary_Pkbinning.py`)
#   /path/to/hdlike          the hdlike checkout (mock DESI BAO data)
#   /path/to/chains          where the MCMC chains live, both read and
#                            written. The proposal matrices ship with the
#                            package, under `hdinitpk/data/proposal_matrices/`.
#   /path/to/planck_data     the Planck 2018 PR3 `clik` likelihood files
#   /path/to/spt_candl_data  the SPT-3G D1 candl data set
#
# The proposal covariance named under `sampler.mcmc.covmat` was rebuilt from
# this run's own converged chain with its bin amplitudes already renamed and
# rescaled to `b<n>`, so it is a full match for the parameters sampled here.
# It ships with the package.
# ----------------------------------------------------------------------
resume: true
theory:
  arbitrary_Pkbinning.BinnedPk:
    speed: -1
    stop_at_error: false
    version: null
    python_path: /path/to/hdInitPk
    nbins: 7
    k_first:
    - 0.0018619358218086469
    - 0.006086768361185574
    - 0.014116290949130859
    - 0.032738172103152
    - 0.07592560372394347
    - 0.17608488594542765
    - 0.40837195277561433
    scale: 1.0e-09
    params:
      b1:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{1}(k)
        prior:
          max: 15.0
          min: 0.0
        ref:
          dist: norm
          loc: 2.0
          scale: 2.0
      b2:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{2}(k)
        prior:
          max: 8.0
          min: 0.5
        ref:
          dist: norm
          loc: 2.0
          scale: 2.0
      b3:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{3}(k)
        prior:
          min: 1.4
          max: 2.4
        ref:
          dist: norm
          loc: 2.0
          scale: 0.35
      b4:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{4}(k)
        prior:
          min: 1.684244231033
          max: 2.142608231033
        ref:
          dist: norm
          loc: 1.92078229356
          scale: 0.0432599716521
      b5:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{5}(k)
        prior:
          min: 1.7
          max: 2.0
        ref:
          dist: norm
          loc: 1.83746132974
          scale: 0.0554164670379
      b6:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{6}(k)
        prior:
          max: 2.552055709924
          min: 1.044795709924
        ref:
          dist: norm
          loc: 2.0
          scale: 0.35
      b7:
        latex: 10^9 e^{-2\tau}\mathcal{P}_{7}(k)
        prior:
          max: 8.46295605247
          min: 0.0
        ref:
          dist: norm
          loc: 2.0
          scale: 0.35
    input_params:
    - b1
    - b2
    - b3
    - b4
    - b5
    - b6
    - b7
    - tau
    output_params: []
  camb:
    version: 1.5.8
    speed: 0.3
    stop_at_error: false
    extra_args:
      kmax: 100
      k_per_logint: 130
      nonlinear: true
      lens_potential_accuracy: 8
      lens_margin: 2050
      lAccuracyBoost: 1.2
      min_l_logl_sampling: 6000
      DoLateRadTruncation: false
      recombination_model: CosmoRec
    ignore_obsolete: false
    use_renames: false
    external_primordial_pk: true
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    params:
      H0:
        latex: H_0
        derived: true
      thetastar:
        latex: \theta_\star
        derived: true
      sigma8:
        latex: \sigma_8
        derived: true
      YHe:
        latex: Y_\mathrm{He}
        derived: true
      zrei:
        latex: z_\mathrm{reio}
        derived: true
      zstar:
        latex: z_\star
        derived: true
      rstar:
        latex: r_{s,\star}
        derived: true
      zdrag:
        latex: z_d
        derived: true
      rdrag:
        latex: r_d
        derived: true
    input_params:
    - ombh2
    - omch2
    - cosmomc_theta
    - tau
    output_params:
    - H0
    - thetastar
    - sigma8
    - YHe
    - zrei
    - zstar
    - rstar
    - zdrag
    - rdrag
likelihood:
  act_dr6_cmbonly.ACTDR6CMBonly:
    data_folder: ACTDR6CMBonly
    ell_cuts:
      TT:
      - 600
      - 8500
      TE:
