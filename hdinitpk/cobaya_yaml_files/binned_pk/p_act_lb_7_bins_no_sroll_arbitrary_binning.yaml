sampler:
  mcmc:
    burn_in: 0
    max_tries: 40d
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - ombh2
        - omch2
        - cosmomc_theta
    - - 1
      - - tau
    - - 1
      - - eneg2tauPk1
        - eneg2tauPk2
        - eneg2tauPk3
        - eneg2tauPk4
        - eneg2tauPk5
        - eneg2tauPk6
        - eneg2tauPk7
    - - 8
      - - A_act
    - - 12
      - - P_act
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.5.4
    covmat: /path/to/hdInitPk/hdinitpk/data/proposal_matrices/act_7_bins_no_sroll.covmat
output: /path/to/chains/pk_chains/ACT/act-7-bins-pk-chains-no-sroll-arbitrary-binning
version: 3.5.4
