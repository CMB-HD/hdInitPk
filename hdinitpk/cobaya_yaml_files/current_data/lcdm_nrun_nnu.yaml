# ----------------------------------------------------------------------
# LCDM + alpha_s + N_eff, on CMB-PAS + DESI DR2.
#
# CMB-PAS + DESI DR2. `CMB-PAS` is Planck 2018 (low-l TT via clipy
# commander, high-l TT/TE/EE via clipy plik, cropped to TT < 1000 and
# TE/EE < 600), ACT DR6 CMB-only, and SPT-3G D1 T&E via candl; plus ACT
# DR6 + Planck + SPT-3G CMB lensing and the DESI DR2 BAO likelihood.
#
# Free parameters beyond LCDM: nrun (alpha_s), nnu (N_eff). `mnu` is fixed at 0.06 eV.
#
# Every `/path/to/...` below is a placeholder that must be edited before
# running:
#   /path/to/camb            a local CAMB checkout, if not using the
#                            installed one (the entry is commented out)
#   /path/to/planck_data     the Planck 2018 PR3 `clik` likelihood files
#   /path/to/hdInitPk        this repository
#   /path/to/chains          where the MCMC chains are written
#
# `sampler.mcmc.covmat` points at the proposal matrix built from this run's
# own converged chain, shipped in `hdinitpk/data/proposal_matrices/`; it is
# a full match for the parameters sampled here. Regenerate it with
# `save_proposal_matrices.py`.
#
# The thinned chain this produced is distributed as
# `hdinitpk/data/chains/pas/pas_lcdm_nrun_nnu`.
# ----------------------------------------------------------------------
resume: True
theory:
  camb:
#    path: /path/to/camb
    stop_at_error: false
