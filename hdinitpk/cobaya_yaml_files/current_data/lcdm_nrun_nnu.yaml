      kmax: 10
      k_per_logint: 130
      nonlinear: true
      lens_potential_accuracy: 8
      lens_margin: 2050
      lAccuracyBoost: 1.2
      min_l_logl_sampling: 6000
      DoLateRadTruncation: false
      recombination_model: CosmoRec
      halofit_version: mead2020
      num_massive_neutrinos: 3
      mnu: 0.06
    params:
      H0:
        latex: H_0
        derived: true
      thetastar:
